name: PR Validation & Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  workflow-security:
    name: Workflow Security Policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Lint GitHub Actions workflows
        uses: rhysd/actionlint@03d0035246f3e81f36aed592ffb4bebf33a03106 # v1.7.7

      - name: Enforce pinned workflow dependencies
        run: ./scripts/check-workflow-security.sh

      - name: Validate repository security configuration
        run: npm run security:config-policy

  validate-pr:
    name: Validate PR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@e32d7e603df1aa1ba07e981f2a23455dee596825 # v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            fix
            feat
            docs
            style
            refactor
            perf
            test
            chore
            ci
            revert
          requireScope: true

      - name: Check PR size
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const additions = pr.additions;
            const deletions = pr.deletions;
            const changedFiles = pr.changed_files;

            const MAX_ADDITIONS = 500;
            const MAX_DELETIONS = 500;
            const MAX_FILES = 30;

            let messages = [];

            if (additions > MAX_ADDITIONS) {
              messages.push(`⚠️ Large addition count: ${additions} lines (max: ${MAX_ADDITIONS})`);
            }

            if (deletions > MAX_DELETIONS) {
              messages.push(`⚠️ Large deletion count: ${deletions} lines (max: ${MAX_DELETIONS})`);
            }

            if (changedFiles > MAX_FILES) {
              messages.push(`⚠️ Many files changed: ${changedFiles} files (max: ${MAX_FILES})`);
            }

            if (messages.length > 0) {
              github.rest.issues.createComment({
                issue_number: pr.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: messages.join('\n') + '\n\n💡 Consider breaking this PR into smaller, more focused changes.'
              });
            }

  label-pr:
    name: Auto-label PR
    runs-on: ubuntu-latest
    if: github.event.action == 'opened'
    permissions:
      contents: read
      issues: write
    steps:
      - name: Add labels based on title
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const title = context.payload.pull_request.title;
            const labels = [];

            if (title.includes('fix:') || title.includes('bugfix')) {
              labels.push('bug');
            }
            if (title.includes('feat:') || title.includes('feature')) {
              labels.push('enhancement');
            }
            if (title.includes('docs:')) {
              labels.push('documentation');
            }
            if (title.includes('refactor:')) {
              labels.push('refactoring');
            }
            if (title.includes('test:')) {
              labels.push('testing');
            }
            if (title.includes('chore:') || title.includes('ci:')) {
              labels.push('maintenance');
            }

            if (labels.length > 0) {
              github.rest.issues.addLabels({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: labels
              });
            }

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Dependency Review
        uses: actions/dependency-review-action@cc4f6536e38d1126c5e3b0683d469a14f23bfea4 # v3
        with:
          fail-on-severity: moderate

  spell-check:
    name: Spell Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run spell check
        uses: crate-ci/typos@d43b6c087ac471e2ea7b8af622ff15f05c0c365b
        with:
          files: .
          exclude: |
            .git
            .github
            node_modules
            dist
            build
            coverage

  commit-lint:
    name: Lint Commit Messages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Validate commit messages
        uses: wagoid/commitlint-github-action@9763196e10f27aef304c9b8b660d31d97fce0f99 # v5
        with:
          configFile: commitlint.config.js

  security-review:
    name: Security Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  pr-summary:
    name: Generate PR Summary
    runs-on: ubuntu-latest
    if: github.event.action == 'opened'
    permissions:
      contents: read
      issues: write
    steps:
      - name: Create PR summary
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const summary = [
              '## 📋 PR Summary',
              '',
              `- **Author:** @${pr.user.login}`,
              `- **Base:** \`${pr.base.ref}\``,
              `- **Head:** \`${pr.head.ref}\``,
              `- **Changed Files:** ${pr.changed_files}`,
              `- **Additions:** +${pr.additions}`,
              `- **Deletions:** -${pr.deletions}`,
              '',
              '## ✅ Checklist',
              '',
              '- [ ] Code follows style guidelines',
              '- [ ] Self-review completed',
              '- [ ] Comments added for complex logic',
              '- [ ] No new warnings generated',
              '- [ ] Tests added/updated',
              '- [ ] Documentation updated',
              '- [ ] No breaking changes',
            ].join('\n');

            github.rest.issues.createComment({
              issue_number: pr.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });

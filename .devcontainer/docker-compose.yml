services:
  app:
    image: mcr.microsoft.com/devcontainers/javascript-node:20
    volumes:
      - ..:/workspaces/HelpingYou:cached
    command: sleep infinity
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/helpingyou
      TEST_DATABASE_NAME: ${TEST_DATABASE_NAME:-helpingyou_test}
      TEST_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/${TEST_DATABASE_NAME:-helpingyou_test}
      REDIS_URL: redis://redis:6379
      TEST_REDIS_URL: redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: helpingyou
      TEST_DATABASE_NAME: ${TEST_DATABASE_NAME:-helpingyou_test}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-with-test-db.sh:/usr/local/bin/postgres-with-test-db.sh:ro
    ports:
      - "5432:5432"
    entrypoint: ["/bin/sh", "/usr/local/bin/postgres-with-test-db.sh"]
    command: ["postgres"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'case "$${TEST_DATABASE_NAME}" in (""|*[!A-Za-z0-9_]*) exit 1 ;; esac; pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" && PGPASSWORD="$${POSTGRES_PASSWORD}" PGHOST=127.0.0.1 psql -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -tAc "SELECT 1 FROM pg_database WHERE datname = ''$${TEST_DATABASE_NAME}''" | grep -q 1'
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:

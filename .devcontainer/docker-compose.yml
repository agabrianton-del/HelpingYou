services:
  app:
    image: mcr.microsoft.com/devcontainers/javascript-node:20
    volumes:
      - ..:/workspaces/HelpingYou:cached
    command: sleep infinity
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/helpingyou
      TEST_DATABASE_NAME: ${TEST_DATABASE_NAME:-helpingyou_test}
      TEST_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/${TEST_DATABASE_NAME:-helpingyou_test}
      REDIS_URL: redis://redis:6379
      TEST_REDIS_URL: redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: helpingyou
      TEST_DATABASE_NAME: ${TEST_DATABASE_NAME:-helpingyou_test}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-init:
    image: postgres:16-alpine
    restart: "no"
    environment:
      PGPASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: helpingyou
      TEST_DATABASE_NAME: ${TEST_DATABASE_NAME:-helpingyou_test}
    volumes:
      - ./postgres-init.sh:/usr/local/bin/postgres-init.sh:ro
    network_mode: "service:postgres"
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/usr/local/bin/postgres-init.sh"]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
